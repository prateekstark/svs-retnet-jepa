# High-Resolution Paper Benchmark Config (v2): Full MUSDB18-HQ on 24 GB GPU (RTX 4090 / A100)
# Upgrades: 22.05 kHz, n_fft=2048 (10.7 Hz/bin), Complex Ratio Masking, Multi-Res STFT Loss, d_model=384, 8-layer RetNet
seed: 42
device: "cuda"

audio:
  sample_rate: 22050
  n_fft: 2048
  hop_length: 512
  n_freq_bins: 1024     # 1024 STFT bins (10.76 Hz/bin -> sharp harmonic & sub-100Hz separation)
  crop_frames: 128      # 128 * 512 / 22050 = 2.97s audio segments -> 1024 x 128 STFT grid
  chunks_per_song: 24   # 24 random 3s crops per full-length song per epoch (~2,064 chunks/epoch)

model:
  retnet_mode: "bidirectional"  # "bidirectional" or "causal" (for O(1) real-time streaming)
  patch_size: [64, 4]           # (freq_patch, time_patch) -> 16 x 32 = 512 tokens
  d_model: 384
  num_layers: 8
  decoder_layers: 4
  num_heads: 8
  ffn_mult: 3
  unet_channels: 64
  use_complex_mask: true        # Phase-aware Complex Ratio Masking with exact mixture conservation
  dropout: 0.1
  predictor_layers: 4
  predictor_dim: 256

jepa_pretrain:
  epochs: 150
  batch_size: 16
  batch_size_24g: 32
  lr: 3.0e-4
  weight_decay: 0.03
  ema_decay: 0.996
  mask_ratio: 0.45
  lambda_var: 0.05

separator:
  mode: "hybrid_ac"             # "unpaired", "paired", or "hybrid_ac"
  epochs: 200
  batch_size: 4
  batch_size_24g: 12
  lr: 3.0e-4
  paired_fraction: 1.0          # Override via --paired-fraction (0.10, 0.25, 1.0)
  lambda_stft: 1.5              # STFT magnitude + log-mag L1 loss
  lambda_sdr: 0.5               # Time-domain SDR + waveform L1 loss
  lambda_mrstft: 0.5            # Multi-Resolution STFT loss (n_fft = 512, 1024, 2048)
  lambda_jepa_verify: 0.4       # Dual Frozen (P_V, P_M) JEPA manifold verification loss
  lambda_coral: 0.3             # Dual Deep CORAL latent distribution alignment
  lambda_remix_cycle: 0.8       # Cross-song Re-Mix Cycle Consistency loss (unpaired songs)
  lambda_orth: 0.2              # Cosine orthogonality disentanglement between z_V and z_M
